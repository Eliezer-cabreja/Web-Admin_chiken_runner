<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Chiken Runner</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/dashboard.css?v=1.2" />
</head>
<body>
  <!-- Video de fondo -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="assets/fondo.mp4" type="video/mp4" />
  </video>

  <div class="bg-overlay"></div>

  <!-- Layout principal -->
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>Chiken Runner</h1>
        <span class="badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <button class="tab-btn active" data-tab="dashboard">
          <i class="fa-solid fa-chart-line tab-icon"></i>
          <span>Dashboard</span>
        </button>
        <button class="tab-btn" data-tab="usuarios">
          <i class="fa-solid fa-users tab-icon"></i>
          <span>Usuarios</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout" id="btnLogout">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
      <!-- ============ TAB DASHBOARD ============ -->
      <section class="tab-content active" id="tab-dashboard">
        <h2 class="tab-title">Dashboard</h2>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">
              <i class="fa-solid fa-user-group"></i>
            </div>
            <div class="stat-info">
              <p class="stat-label">Jugadores Online</p>
              <h3 class="stat-value" id="statOnline">--</h3>
            </div>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-header">
            <h3><i class="fa-solid fa-chart-column"></i> Jugadores Conectados</h3>
          </div>
          <div class="chart-container">
            <canvas id="graficaJugadores"></canvas>
          </div>
        </div>
      </section>

      <!-- ============ TAB USUARIOS ============ -->
      <section class="tab-content" id="tab-usuarios">
        <h2 class="tab-title">Usuarios</h2>

        <!-- Loader -->
        <div class="users-loader" id="usersLoader">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <span>Cargando usuarios...</span>
        </div>

        <!-- Mensaje vacío / error -->
        <div class="users-empty" id="usersEmpty" style="display:none;">
          <i class="fa-solid fa-inbox"></i>
          <p>No hay usuarios registrados</p>
        </div>

        <!-- Grid de usuarios -->
        <div class="users-grid" id="usersGrid"></div>
      </section>
    </main>
  </div>

  <script>
    // ====== Protección de sesión ======
    if (!sessionStorage.getItem("admin_logueado")) {
      window.location.href = "../login.html";
    }

    // ====== Cambio de tabs ======
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabContents = document.querySelectorAll(".tab-content");

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        tabButtons.forEach((b) => b.classList.remove("active"));
        tabContents.forEach((c) => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + tab).classList.add("active");

        if (tab === "usuarios") {
          cargarUsuarios();
        }
      });
    });

    // ====== Cerrar sesión ======
    document.getElementById("btnLogout").addEventListener("click", () => {
      sessionStorage.removeItem("admin_logueado");
      sessionStorage.removeItem("admin_user");
      window.location.href = "../login.html";
    });

    // ============================================================
    // ============ GRÁFICA DE JUGADORES ONLINE ===================
    // ============================================================
    const API_ONLINES = "https://api-chicken-runner.monitorealo.online/api/web_admin/onlines";

    const MAX_PUNTOS = 12;
    const INTERVALO_MS = 5000;

    const labels = [];
    const dataPoints = [];

    const ctx = document.getElementById("graficaJugadores").getContext("2d");

    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, "rgba(255, 204, 0, 0.4)");
    gradient.addColorStop(1, "rgba(255, 204, 0, 0.02)");

    const grafica = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Jugadores Online",
            data: dataPoints,
            borderColor: "#ffcc00",
            backgroundColor: gradient,
            borderWidth: 2.5,
            tension: 0.4,
            fill: true,
            pointBackgroundColor: "#ffcc00",
            pointBorderColor: "#1e1e1e",
            pointRadius: 4,
            pointHoverRadius: 6,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 600 },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "rgba(30,30,30,0.95)",
            titleColor: "#ffcc00",
            bodyColor: "#e0e0e0",
            borderColor: "#ffcc00",
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              label: (item) => ` ${item.parsed.y} jugadores`,
            },
          },
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { color: "#a0a0a0", stepSize: 1, precision: 0 },
            grid: { color: "rgba(255,255,255,0.05)" },
          },
          x: {
            ticks: { color: "#a0a0a0", maxRotation: 0 },
            grid: { display: false },
          },
        },
      },
    });

    async function actualizarJugadores() {
      try {
        const res = await fetch(API_ONLINES);
        const data = await res.json();

        const cantidad = data?.Datos?.info?.Cantidad_users ?? 0;
        document.getElementById("statOnline").textContent = cantidad;

        const ahora = new Date();
        const hora = ahora.toLocaleTimeString("es-ES", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });

        labels.push(hora);
        dataPoints.push(cantidad);

        if (labels.length > MAX_PUNTOS) {
          labels.shift();
          dataPoints.shift();
        }

        grafica.update();
      } catch (err) {
        console.error("Error al obtener jugadores:", err);
      }
    }

    actualizarJugadores();
    setInterval(actualizarJugadores, INTERVALO_MS);

    // ============================================================
    // ============ LISTA DE USUARIOS (TAB) ======================
    // ============================================================
    const API_USUARIOS = "https://api-chicken-runner.monitorealo.online/api/web_admin/usuarios_database";

    const usersGrid = document.getElementById("usersGrid");
    const usersLoader = document.getElementById("usersLoader");
    const usersEmpty = document.getElementById("usersEmpty");

    let usuariosCargados = false;
    let listaOnline = [];
    let intervaloUsuarios = null;

    // Obtener lista de usuarios en línea
    async function obtenerOnlineUsers() {
      try {
        const res = await fetch(API_ONLINES);
        const data = await res.json();
        const nombres = data?.Datos?.info?.nombre_usuarios ?? [];
        return nombres;
      } catch (err) {
        console.error("Error al obtener usuarios online:", err);
        return [];
      }
    }

    // Cargar usuarios
    async function cargarUsuarios(force = false) {
      if (usuariosCargados && !force) {
        await actualizarEstadoOnline();
        return;
      }

      usersLoader.style.display = "flex";
      usersEmpty.style.display = "none";
      usersGrid.innerHTML = "";

      try {
        const [resUsuarios, online] = await Promise.all([
          fetch(API_USUARIOS).then((r) => r.json()),
          obtenerOnlineUsers(),
        ]);

        listaOnline = online.map((n) => String(n).toLowerCase());

        if (!resUsuarios.status || !resUsuarios?.Datos?.info?.usuarios?.length) {
          usersLoader.style.display = "none";
          usersEmpty.style.display = "flex";
          usuariosCargados = true;
          return;
        }

        const usuarios = resUsuarios.Datos.info.usuarios;

        usersGrid.innerHTML = usuarios
          .map((u) => {
            const id = u[0];
            const nombre = u[1];
            const estaOnline = listaOnline.includes(String(nombre).toLowerCase());

            return `
              <div class="user-card ${estaOnline ? "online" : ""}" data-id="${id}">
                <div class="user-info">
                  <div class="user-avatar ${estaOnline ? "avatar-online" : ""}">
                    <i class="fa-solid fa-user"></i>
                  </div>
                  <div class="user-text">
                    <p class="user-name ${estaOnline ? "online-name" : ""}">
                      ${escapeHtml(nombre)}
                      ${estaOnline ? '<span class="online-dot" title="En línea"></span>' : ""}
                    </p>
                    <p class="user-id">ID: ${id}</p>
                  </div>
                </div>
                <div class="user-actions">
                  <button class="btn-action btn-edit" title="Cambiar nombre" data-id="${id}" data-name="${escapeHtml(nombre)}">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button class="btn-action btn-inventory" title="Ver inventario" data-id="${id}">
                    <i class="fa-solid fa-box-open"></i>
                  </button>
                  <button class="btn-action btn-delete" title="Eliminar cuenta" data-id="${id}" data-name="${escapeHtml(nombre)}">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>
            `;
          })
          .join("");

        usersLoader.style.display = "none";
        usuariosCargados = true;

        enlazarBotonesUsuarios();

        if (intervaloUsuarios) clearInterval(intervaloUsuarios);
        intervaloUsuarios = setInterval(actualizarEstadoOnline, 5000);
      } catch (err) {
        console.error("Error al cargar usuarios:", err);
        usersLoader.style.display = "none";
        usersEmpty.style.display = "flex";
        usersEmpty.querySelector("p").textContent = "Error al cargar usuarios";
      }
    }

    // Solo actualizar el estado online
    async function actualizarEstadoOnline() {
      if (!usuariosCargados) return;

      const online = await obtenerOnlineUsers();
      listaOnline = online.map((n) => String(n).toLowerCase());

      document.querySelectorAll(".user-card").forEach((card) => {
        const nameEl = card.querySelector(".user-name");
        if (!nameEl) return;

        const nombre = nameEl.childNodes[0]?.nodeValue?.trim().toLowerCase() || "";
        const estaOnline = listaOnline.includes(nombre);

        card.classList.toggle("online", estaOnline);
        nameEl.classList.toggle("online-name", estaOnline);

        const avatar = card.querySelector(".user-avatar");
        avatar?.classList.toggle("avatar-online", estaOnline);

        let dot = nameEl.querySelector(".online-dot");
        if (estaOnline && !dot) {
          dot = document.createElement("span");
          dot.className = "online-dot";
          dot.title = "En línea";
          nameEl.appendChild(dot);
        } else if (!estaOnline && dot) {
          dot.remove();
        }
      });
    }

    // Enlazar botones (sin funciones aún)
    function enlazarBotonesUsuarios() {
      document.querySelectorAll(".btn-edit").forEach((btn) => {
        btn.addEventListener("click", () => {
          console.log("Editar usuario:", btn.dataset.id, btn.dataset.name);
        });
      });

      document.querySelectorAll(".btn-inventory").forEach((btn) => {
        btn.addEventListener("click", () => {
          console.log("Ver inventario del usuario:", btn.dataset.id);
        });
      });

      document.querySelectorAll(".btn-delete").forEach((btn) => {
        btn.addEventListener("click", () => {
          console.log("Eliminar usuario:", btn.dataset.id, btn.dataset.name);
        });
      });
    }

    // Escapar HTML
    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
