<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Chiken Runner</title>
  <link rel="stylesheet" href="templates/css/dashboard.css" />
</head>
<body>
  <!-- Video de fondo -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="templates/assets/fondo.mp4" type="video/mp4" />
  </video>

  <!-- Overlay -->
  <div class="bg-overlay"></div>

  <!-- Layout principal -->
  <div class="layout">
    <!-- Sidebar izquierda -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>Chiken Runner</h1>
        <span class="badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <button class="tab-btn active" data-tab="dashboard">
          <span class="tab-icon">📊</span>
          <span>Dashboard</span>
        </button>
        <button class="tab-btn" data-tab="usuarios">
          <span class="tab-icon">👥</span>
          <span>Usuarios</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout" id="btnLogout">
          <span>🚪</span> Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
      <!-- Tab Dashboard -->
      <section class="tab-content active" id="tab-dashboard">
        <h2 class="tab-title">Dashboard</h2>
        <!-- Aquí irá el contenido del dashboard -->
      </section>

      <!-- Tab Usuarios -->
      <section class="tab-content" id="tab-usuarios">
        <h2 class="tab-title">Usuarios</h2>
        <!-- Aquí irá el contenido de usuarios -->
      </section>
    </main>
  </div>

  <script>
    // ====== Protección: si no hay sesión, volver al login ======
    if (!sessionStorage.getItem("admin_logueado")) {
      window.location.href = "login.html";
    }

    // ====== Cambio de tabs ======
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabContents = document.querySelectorAll(".tab-content");

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;

        tabButtons.forEach((b) => b.classList.remove("active"));
        tabContents.forEach((c) => c.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById("tab-" + tab).classList.add("active");
      });
    });

    // ====== Cerrar sesión ======
    document.getElementById("btnLogout").addEventListener("click", () => {
      sessionStorage.removeItem("admin_logueado");
      sessionStorage.removeItem("admin_user");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
